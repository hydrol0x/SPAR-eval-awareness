name: Rollout Atlas (GitHub Pages)

# Builds the explorer's data from the rollouts in this repo and publishes explorer/ to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [eval-awareness-cot-control-exp]
    paths: ["experiments/**", "explorer/**", ".github/workflows/explorer-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data and site
        run: |
          mkdir -p _site
          python explorer/build.py --out _site/data
          cp explorer/index.html explorer/app.js explorer/style.css _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
